<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Mission Control</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=B612:wght@400;700&family=B612+Mono:wght@400;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style id="css">
/* Layout: a plain daily tracker. Computer: masthead (date + countdowns), Tell Claude bar, three columns
   (today + habits | week + year | suggested, this week, goals); STATS view = time log | stats.
   Sections are separated by one hairline each; only tappable things (cards, buttons, chips, inputs) carry a border.
   Phone: sticky clock bar, one section per tab, bottom tab bar with a center capture key.
   Color: white = values, green = complete, magenta = happening now,
   amber = caution, red = warning, cyan = controls you can press. Nothing else gets color. Single dark theme by design. */
:root{--bg:#0f0f11;--panel:#17171a;--panel2:#1c1c20;--panel3:#26262b;--rule:#232327;--ink:#ededef;--dim:#9b9ba3;--faint:#74747c;--green:#5ecf87;--amber:#e3b357;--red:#ef6f6f;--cyan:#8b8cf8;--magenta:#d783d1;--mono:"Inter",system-ui,-apple-system,sans-serif;--sans:"Inter",system-ui,-apple-system,sans-serif;color-scheme:dark;}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
#app{max-width:1440px;margin:0 auto;padding-block:12px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.lbl{font:500 .8rem/1 var(--mono);letter-spacing:0;color:var(--dim);text-transform:none}

/* masthead + clocks (computer) */
.mast{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--rule);padding:0 12px 12px}
.mast b{font:500 .8rem/1 var(--mono);letter-spacing:0}
.mast .mdt{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 18px;min-width:0}
.mast .mck{font:400 .8rem/1 var(--mono);letter-spacing:0;color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
.fresh{font:500 .8rem/1 var(--mono);letter-spacing:0;padding:6px 9px;border:1px solid var(--rule);color:var(--dim)}
.fresh.ok{color:var(--green);border-color:color-mix(in srgb,var(--green) 45%,transparent)}
.fresh.exp{color:var(--amber);border-color:var(--amber)}
.fresh.bad{color:var(--red);border-color:var(--red)}
/* Sync chip: chip-sized button; ::after pads the hit area to 42px (44px in the phone bar) without growing the bar */
button.fresh.run{position:relative;background:none;cursor:pointer;white-space:nowrap}
button.fresh.run::after{content:"";position:absolute;left:-4px;right:-4px;top:-8px;bottom:-8px}
.mast .tcgo{min-height:40px;padding:8px 12px}
.mast .vt button{min-height:38px}

/* phone clock bar */
.pbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--bg);display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0 10px;border-bottom:1px solid var(--rule)}
.pbar span{display:flex;align-items:baseline;gap:8px;min-width:0}
.pbar b{font:500 .8rem/1 var(--mono);letter-spacing:0}
.pbar i{font:400 .8rem/1 var(--mono);font-style:normal;letter-spacing:0;color:var(--dim)}
.pbar em{font:700 1rem/1 var(--mono);font-style:normal;font-variant-numeric:tabular-nums;white-space:nowrap}
.pbar .fresh{padding:4px 6px}
@media (max-width:359px){.pbar b,.pbar i{display:none}.pbar em{font-size:.92rem}}
.pbar button.fresh.run{letter-spacing:0;padding:4px 5px}
/* phone: one-line SUGGESTED strip under the bar (TODAY tab only); tapping it opens the WEEK tab */
.pstrip{display:flex}
.pstrip button{flex:1;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px;padding:0 12px;border:0;border-bottom:1px solid var(--rule);background:transparent;color:var(--cyan);font:500 .8rem/1 var(--mono);letter-spacing:0;text-align:left;cursor:pointer}
.pstrip button span{font-size:1rem;line-height:1}
#app:not([data-tab="today"]) .pstrip{display:none}
.pbar button.fresh.run::after{top:-11px;bottom:-11px}
.pbar b{white-space:nowrap}
/* the Sync chip takes the room the bar's labels used on phones; the 359px rule above drops more */
@media (max-width:479px){.pbar i{display:none}}
@media (max-width:429px){.pbar{gap:6px}.pbar b{letter-spacing:0}.pbar em{font-size:.88rem}}

/* consoles */
.grid{display:flex;flex-direction:column;gap:12px}
.col{display:contents}
.p{border:0;border-top:1px solid var(--rule);background:transparent;min-width:0}
.ph{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:4px 10px;padding:12px 12px 8px}
.ph h2{margin:0;white-space:nowrap;font:500 .8rem/1 var(--mono);letter-spacing:0;color:var(--dim);text-transform:none}
.ph>span{font:400 .8rem/1 var(--mono);letter-spacing:0;color:var(--dim);text-transform:none;text-align:right}
.ph>span.c{color:var(--amber)}
.pht{display:flex;align-items:center;gap:2px;min-width:0}
/* info button: 20px ring, 40px hit area that does not grow the header */
.info{position:relative;flex:none;width:40px;height:40px;margin:-12px -10px -12px -4px;padding:0;background:none;border:0;color:var(--cyan);font:500 .8rem/1 var(--mono);display:grid;place-items:center}
.info::before{content:"";position:absolute;left:10px;top:10px;width:20px;height:20px;border:1.5px solid currentColor;border-radius:50%}
.info:hover{color:var(--ink)}
.acts .info{margin:0 0 0 -10px}
.grow{flex:1}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.body{padding:12px}
.note{font:400 .8rem/1.5 var(--mono);color:var(--dim)}
.note b{color:var(--ink);font-weight:700;letter-spacing:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:8px 14px;border:1px solid var(--cyan);background:transparent;color:var(--cyan);font:500 .8rem/1 var(--mono);letter-spacing:0;text-transform:none}
.btn.fill{background:var(--cyan);color:var(--bg)}
.btn.sm{min-height:32px;padding:6px 10px;font-size:.8rem}
.btn:disabled{opacity:.45;cursor:default}
input[type=text],textarea{width:100%;min-width:0;font:16px/1.4 var(--sans);color:var(--ink);background:var(--bg);border:1px solid var(--rule);padding:10px 12px;border-radius:8px}
input[type=text]:focus,textarea:focus{border-color:var(--cyan);outline:none}
textarea{resize:vertical;min-height:64px}
::placeholder{color:var(--faint)}
.row2{display:flex;gap:8px;align-items:stretch}
.row2 input{flex:1}
/* checkbox: the real input sits invisible over the whole label (so the hit area is the label), the box and its check are
   the .ckb span after it. The check is an inline SVG whose stroke draws in (Safari does not render ::after on an input). */
.cb{position:relative}
.cb input[type=checkbox]{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer;appearance:none;-webkit-appearance:none}
.ckb{width:22px;height:22px;border:1.5px solid var(--dim);border-radius:6px;background:transparent;display:grid;place-items:center;pointer-events:none;transition:background-color .2s ease-out,border-color .2s ease-out}
.ckb svg{width:14px;height:14px;fill:none;stroke:#0f0f11;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.ckb path{stroke-dasharray:22;stroke-dashoffset:22;transition:stroke-dashoffset .25s ease-out}
.cb input:checked+.ckb{background:var(--green);border-color:var(--green)}
.cb input:checked+.ckb path{stroke-dashoffset:0;transition-delay:.05s}
.cb input:focus-visible+.ckb{outline:2px solid var(--cyan);outline-offset:2px}
.cb:hover .ckb{border-color:var(--cyan)}
.cb input:checked:hover+.ckb{border-color:var(--green)}
.tag{display:inline-block;vertical-align:middle;font:500 .8rem/1 var(--mono);letter-spacing:0;padding:3px 4px;border:1px solid currentColor;white-space:nowrap}
.t-act{color:var(--magenta)}.t-late{color:var(--amber)}.t-next{color:var(--ink)}.t-done{color:var(--green)}

/* now card */
.now .body{display:flex;flex-direction:column;gap:12px}
.now .state{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.now .big{font-size:1.18rem;line-height:1.35;font-weight:700}
.big.rt{display:block;padding:0;font-size:1.18rem;font-weight:700}
.chev{color:var(--cyan);margin-left:.3em}
.big.rt:hover .chev{color:var(--ink)}
.now.is-act{border-color:var(--magenta);box-shadow:inset 3px 0 0 var(--magenta)}
.now .when{font:500 .85rem/1 var(--mono);font-variant-numeric:tabular-nums;color:var(--dim)}
.now.is-act .when{color:var(--magenta)}
.burn{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.burn .clock{font:700 2rem/1 var(--mono);font-variant-numeric:tabular-nums;color:var(--magenta)}
.burn .clock.done{color:var(--green);font-size:1rem;letter-spacing:0}

/* today list */
.rows{list-style:none;margin:0;padding:0}
.rows>li{border-top:1px solid var(--rule)}
.rows>li:first-child{border-top:0}
.row{display:grid;grid-template-columns:minmax(0,1fr) 52px;align-items:stretch}
.rt{display:grid;grid-template-columns:62px minmax(0,1fr);gap:12px;align-items:start;width:100%;min-width:0;text-align:left;background:none;border:0;padding:13px 0 13px 12px;color:inherit;font:inherit;cursor:pointer}
.rt:hover .tx,.rt:hover .bx{color:var(--cyan)}
.cb{display:grid;place-items:center;cursor:pointer;min-height:48px}
.row .tm{font:500 .8rem/1.5 var(--mono);color:var(--dim);font-variant-numeric:tabular-nums;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.row .tx{min-width:0}
.row .tx{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.row .gl{font:400 .8rem/1 var(--mono);letter-spacing:0;color:var(--faint)}
.row.active{box-shadow:inset 3px 0 0 var(--magenta);background:color-mix(in srgb,var(--magenta) 6%,transparent)}
.row.active .tm{color:var(--magenta)}
.row.late .tm{color:var(--amber)}
.row.done .tx,.row.done .tm{color:var(--dim)}
.row.done .tm{text-decoration:line-through}
.expired{padding:10px 12px;border-bottom:1px solid var(--rule);font:500 .8rem/1.5 var(--mono);letter-spacing:0;color:var(--amber)}
.memo{padding:10px 12px;border-top:1px solid var(--rule)}

/* day timeline (computer) */
.tl{position:relative;margin:10px 12px 14px 0}
.hr{position:absolute;left:52px;right:0;border-top:1px solid var(--rule)}
.hr span{position:absolute;left:-46px;top:-8px;font:400 .8rem/1 var(--mono);color:var(--faint);font-variant-numeric:tabular-nums}
.blk{position:absolute;border:1px solid var(--rule);background:var(--panel2);display:grid;grid-template-columns:minmax(0,1fr) 34px;overflow:hidden}
.blk .rt{display:flex;flex-direction:column;gap:2px;padding:6px 0 6px 8px;overflow:hidden}
.blk .cb{min-height:0;align-items:start;padding-top:6px}
.blk .bt{font:500 .8rem/1.3 var(--mono);color:var(--dim);font-variant-numeric:tabular-nums}
.blk .bx{font-size:.84rem;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.blk .bt{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk.active{border-color:var(--magenta);box-shadow:inset 3px 0 0 var(--magenta)}
.blk.active .bt{color:var(--magenta)}
.blk.late{border-color:color-mix(in srgb,var(--amber) 70%,transparent)}
.blk.late .bt{color:var(--amber)}
.blk.done{border-color:color-mix(in srgb,var(--green) 40%,transparent)}
.blk.done .bx{color:var(--dim);text-decoration:line-through}
.nowl{position:absolute;left:52px;right:0;border-top:1.5px solid var(--ink);z-index:2;pointer-events:none}
.nowl span{position:absolute;left:-56px;top:-10px;font:500 .8rem/1 var(--mono);font-variant-numeric:tabular-nums;background:var(--ink);color:var(--bg);padding:3px 4px}
.anyl{border-top:1px solid var(--rule);padding:9px 12px 4px}


/* year track: the whole year on one line */
.trk .body{padding:10px 16px 6px}
.track{position:relative;height:60px;margin:0 4px}
.track .ln{position:absolute;left:0;right:0;top:27px;height:6px;background:var(--rule)}
.track .el{position:absolute;left:0;top:27px;height:6px;background:var(--faint)}
.track .band{position:absolute;top:24px;height:12px;border:1px solid var(--faint);background:color-mix(in srgb,var(--dim) 22%,transparent)}
.track .ms{position:absolute;top:21px;height:18px;border-left:1.5px solid var(--dim)}
.track .ms span{position:absolute;left:0;transform:translateX(-50%);font:500 .8rem/1 var(--mono);letter-spacing:0;color:var(--dim);white-space:nowrap}
.track .ms.up span{bottom:22px}.track .ms.dn span{top:22px}
.track .ms.l span{transform:none}.track .ms.r span{transform:translateX(-100%)}
@media (max-width:999px){.track .ms span{letter-spacing:0}}
.track .ms.key{border-left-color:var(--ink)}.track .ms.key span{color:var(--ink)}
.track .td{position:absolute;top:14px;height:32px;border-left:2px solid var(--magenta)}
.track .td::before{content:"";position:absolute;left:-5px;top:-4px;border:4px solid transparent;border-top:6px solid var(--magenta)}
/* objectives, upcoming */
.row.obj .rt{grid-template-columns:minmax(0,1fr)}
.upc{display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:10px 12px}
.upc .dd{font:500 .85rem/1 var(--mono);font-variant-numeric:tabular-nums;color:var(--dim)}
.upc.hard .dd{color:var(--ink)}
.upc.near .dd{color:var(--amber)}
.upc.soft .ut{color:var(--dim)}
.upc .dt{font:400 .8rem/1 var(--mono);letter-spacing:0;color:var(--faint);white-space:nowrap}

/* goals */
.poll{display:flex;flex-direction:column}
.stn{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;min-width:0;border-top:1px solid var(--rule)}
.stn:first-child{border-top:0}
.stn-h{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;background:none;border:0;padding:0;color:inherit;cursor:pointer;text-align:left;min-height:36px}
.stn-h:hover h3{color:var(--cyan)}
.stn h3{margin:0;font:500 .8rem/1 var(--mono);letter-spacing:0}
.light{display:inline-flex;align-items:center;gap:7px;font:500 .8rem/1 var(--mono);letter-spacing:0;padding:7px 9px;border:1px solid currentColor;background:transparent;min-width:84px;justify-content:center}
.light::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.light.go{color:var(--green)}.light.hold{color:var(--amber)}.light.nogo{color:var(--red)}
.goal{font-size:.92rem}
.nx{font-size:.84rem;color:var(--dim)}
.tel{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.tel button{height:30px;border:1px solid var(--rule);background:transparent;color:var(--dim);font:500 .8rem/1 var(--mono);padding:0}
.tel button.on{background:var(--green);border-color:var(--green);color:var(--bg)}
.tel button.today{border-color:var(--cyan);color:var(--cyan)}
.tel button.on.today{color:var(--bg)}
.tel button:disabled{opacity:.3;cursor:default}
.pace{font:500 .8rem/1.4 var(--mono);letter-spacing:0;color:var(--dim)}
.pace.c{color:var(--amber)}.pace.w{color:var(--red)}.pace.g{color:var(--green)}
/* habits: the 7-day trackers (PT, COMMS) on TODAY under the day plan; .tel and .pace above are shared */
.habs{display:flex;flex-direction:column}
.hab{padding:8px 12px 14px;display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--rule);min-width:0}
.hab:first-child{border-top:0}
.habh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;min-width:0}
.hab h3{margin:0;font:600 .8rem/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.habp .tel button{height:40px}
@media (max-width:999px){.habp .tel button{height:44px}}

/* Claude chat, capture, wrap-up */
.xs{display:flex;flex-direction:column;gap:10px;max-height:340px;overflow:auto;margin-bottom:10px}
.msg{font-size:.9rem;line-height:1.5;white-space:pre-wrap}
.msg.cc{border-left:2px solid var(--cyan);padding-left:10px}
.capf{display:flex;flex-direction:column;gap:8px}
.capf .acts{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.inb{list-style:none;margin:10px 0 0;padding:0}
.inb li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--rule);font-size:.88rem}
.x{background:none;border:0;color:var(--faint);font:700 .9rem/1 var(--mono);padding:6px 8px;min-width:32px;min-height:32px}
.sdl{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-bottom:12px;font:500 .8rem/1.3 var(--mono);letter-spacing:0;color:var(--dim)}
.sdl .c{color:var(--amber)}
.eng{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap;align-items:center}
.eng button{width:40px;height:40px;border:1px solid var(--rule);background:transparent;color:var(--dim);font:500 .85rem var(--mono)}
.eng button.on{border-color:var(--cyan);color:var(--cyan)}
.sdone{font:500 .85rem/1.5 var(--mono);letter-spacing:0;color:var(--green)}

.err{border:1px solid var(--red);color:var(--red);padding:12px;font:500 .8rem/1.5 var(--mono);letter-spacing:0}
/* proposals, view toggle */
.mr{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.vt{display:flex;border:1px solid var(--rule)}
.vt button{background:transparent;border:0;color:var(--dim);font:500 .8rem/1 var(--mono);letter-spacing:0;padding:8px 12px;min-height:32px}
.vt button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.pc{padding:12px;border-top:1px solid var(--rule);display:flex;flex-direction:column;gap:6px}
.pc:first-of-type{border-top:0}
.pc .pt{display:block;padding:0;font-size:.95rem;font-weight:700;line-height:1.35}
.pm{font:500 .8rem/1.5 var(--mono);letter-spacing:0;color:var(--ink)}
.pc .dacts{margin-top:4px}
/* where a proposal lands: dashed cyan edge like its calendar block; also the proposal rows in Upcoming */
.pm .pl,.dm .pl{display:inline-block;padding:3px 6px;margin-right:6px;border:1.5px dashed var(--cyan);color:var(--ink);letter-spacing:0;white-space:nowrap}
.upc.prop .ut{color:var(--ink);font-weight:700}
.upc.prop .dt b{display:block;margin-top:4px;font:500 .8rem/1 var(--mono);letter-spacing:0;color:var(--cyan);text-align:right}
.capf .acts .fill{order:2}
.upc .ut{display:block;padding:0;grid-template-columns:none;line-height:1.4}
@media (max-width:999px){.pc .pt{min-height:40px;padding:9px 0;margin:-9px 0}}
input[type=date],input[type=number]{font:16px/1 var(--mono);color:var(--ink);background:var(--bg);border:1px solid var(--rule);padding:8px;min-height:40px;border-radius:8px;max-width:11em}
input[type=number]{max-width:6em}
/* detail card */
.dscrim{z-index:45}
.dsheet{position:fixed;left:0;right:0;bottom:0;z-index:50;max-height:86vh;overflow:auto;background:var(--panel2);border-top:1.5px solid var(--cyan);padding-top:12px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.dhd{display:flex;justify-content:space-between;align-items:center}
.dsheet h3{margin:4px 0 8px;font:700 1.25rem/1.3 var(--sans);text-wrap:balance}
.dm{font:500 .8rem/1.6 var(--mono);letter-spacing:0;color:var(--dim);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dd{font-size:.98rem;line-height:1.55;margin:12px 0;max-width:62ch}
.dd b{font:500 .8rem var(--mono);letter-spacing:0;color:var(--dim);margin-right:6px}
.dacts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn.ghost{border-color:var(--rule);color:var(--dim)}
.btn.warn{border-color:var(--red);color:var(--red)}
.confirm{margin-top:12px;padding:12px;border:1px solid var(--red);font-size:.92rem}
.dtime{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;margin-top:14px;padding-top:12px;border-top:1px solid var(--rule)}
.dtime label{display:flex;flex-direction:column;gap:4px;font:500 .8rem/1 var(--mono);letter-spacing:0;color:var(--dim)}
input[type=time]{font:16px/1 var(--mono);color:var(--ink);background:var(--bg);border:1px solid var(--rule);padding:8px;min-height:40px;border-radius:8px}
.seg{display:flex;gap:6px;margin-top:8px}
.seg button{flex:1;min-height:44px;border:1px solid var(--rule);background:transparent;color:var(--dim);font:500 .8rem var(--mono);letter-spacing:0}
.seg button.go.on{border-color:var(--green);color:var(--green)}.seg button.hold.on{border-color:var(--amber);color:var(--amber)}.seg button.nogo.on{border-color:var(--red);color:var(--red)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:35;background:var(--ink);color:var(--bg);display:flex;align-items:center;gap:12px;padding:6px 6px 6px 14px;font:500 .8rem/1.2 var(--mono);letter-spacing:0;max-width:calc(100vw - 32px)}
.toast .btn{border-color:var(--bg);color:var(--bg)}
@media (min-width:1000px){
  .dsheet{left:50%;right:auto;top:50%;bottom:auto;transform:translate(-50%,-50%);width:min(580px,92vw);max-height:80vh;border:1px solid var(--rule);border-top:2px solid var(--cyan);padding:16px 22px 22px}
  .toast{bottom:24px}
}
.duepin{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;padding:8px 10px;border:1px solid var(--rule);font:500 .8rem/1.4 var(--mono);letter-spacing:0;color:var(--dim)}
.duepin .rt{display:inline;padding:0;font:700 .92rem/1.4 var(--sans);letter-spacing:0;color:var(--ink)}
.duepin.c{border-color:var(--amber);color:var(--amber)}.duepin.w{border-color:var(--red);color:var(--red)}
@media (max-width:999px){
  .btn.sm{min-height:40px}
  .tel button{height:40px}
  .x{min-width:44px;min-height:44px}
  .stn-h{min-height:44px}
  .eng button{width:44px;height:44px}
}
/* stats module */
/* STATS panel. Every selector is scoped under .statp. Tokens only: values --ink, labels --dim/--faint,
   status --green/--amber/--red (always next to a word). Square corners, mono labels, like the rest of the console. */
.statp .body{padding:0;container:st/inline-size}
.statp .st-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:1px;background:var(--rule)}
.statp .st-sec{background:var(--bg);padding:14px 12px 16px;min-width:0;display:flex;flex-direction:column;gap:12px}
.statp .st-sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* section head: name left, verdict right */
.statp .st-hd{display:flex;justify-content:space-between;align-items:center;gap:6px 10px;flex-wrap:wrap;min-height:22px}
.statp .st-hd h3{margin:0;font:500 .8rem/1 var(--mono);letter-spacing:0;color:var(--dim);text-transform:none;white-space:nowrap}
.statp .st-vd{font:500 .8rem/1 var(--mono);letter-spacing:0;padding:4px 6px;border:1px solid currentColor;white-space:nowrap;color:var(--dim)}
.statp .st-vd.g,.statp .st-hs.g,.statp .st-of em.g{color:var(--green)}
.statp .st-vd.c,.statp .st-hs.c,.statp .st-of em.c{color:var(--amber)}
.statp .st-vd.w,.statp .st-hs.w,.statp .st-of em.w{color:var(--red)}
.statp .st-empty{margin:0;font:400 .8rem/1.5 var(--mono);color:var(--dim)}

/* figures */
.statp .st-fig{display:flex;align-items:center;gap:12px}
.statp .st-big{font:700 2.1rem/1 var(--mono);color:var(--ink);letter-spacing:0;white-space:nowrap}
.statp .st-mid{font:700 1.45rem/1 var(--mono);color:var(--ink);white-space:nowrap}
.statp .st-of{font:400 .8rem/1.45 var(--mono);letter-spacing:0;color:var(--dim);text-transform:none}
.statp .st-of b{color:var(--ink);font-weight:700}
.statp .st-of em{font-style:normal;font-weight:700}
.statp .st-figs{display:flex;flex-wrap:wrap;gap:12px 28px}
.statp .st-tile{display:flex;align-items:center;gap:10px;min-width:0}

/* 1. load rows: day | track with capacity tick | committed */
.statp .st-days{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.statp .st-day{display:grid;grid-template-columns:56px minmax(0,1fr) 92px;gap:10px;align-items:center;min-height:24px}
.statp .st-dl{font:400 .8rem/1 var(--mono);letter-spacing:0;color:var(--dim);white-space:nowrap;font-variant-numeric:tabular-nums}
.statp .st-day.td .st-dl{color:var(--ink);font-weight:700}
.statp .st-trk{position:relative;height:10px}
.statp .st-cap{position:absolute;left:0;top:0;bottom:0;background:var(--rule)}
.statp .st-bar{position:absolute;left:0;top:0;bottom:0;background:var(--dim)}
.statp .st-day.c .st-bar{background:var(--amber)}
.statp .st-day.w .st-bar{background:var(--red)}
.statp .st-tick{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;background:var(--ink);box-shadow:0 0 0 1px var(--bg)}
.statp .st-dv{display:flex;align-items:center;justify-content:flex-end;gap:6px;font:500 .8rem/1 var(--mono);color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums}
.statp .st-dv s{text-decoration:none;color:var(--faint);font-weight:400}
.statp .st-dv em{font:500 .8rem/1 var(--mono);font-style:normal;letter-spacing:0;padding:3px 4px;border:1px solid currentColor}
.statp .st-day.c .st-dv em{color:var(--amber)}
.statp .st-day.w .st-dv em{color:var(--red)}

/* 2. balance split */
.statp .st-ends{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font:400 .8rem/1 var(--mono);letter-spacing:0;color:var(--dim);text-transform:none;white-space:nowrap}
.statp .st-ends b{font-size:1.05rem;letter-spacing:0;color:var(--ink);margin:0 2px}
.statp .st-ends i{font-style:normal;color:var(--faint);letter-spacing:0}
.statp .st-split{display:flex;gap:2px;height:14px;margin-top:-4px}
.statp .st-split i{display:block;height:100%}
.statp .st-wk{flex:0 1 auto;background:var(--dim)}
.statp .st-lf{flex:1 1 0;min-width:3px}
.statp .st-lf.g{background:var(--green)}
.statp .st-lf.c{background:var(--amber)}
.statp .st-lf.w{background:var(--red)}
.statp .st-pips{display:flex;gap:3px}
.statp .st-pips i{display:block;width:10px;height:10px;border:1.5px solid var(--faint)}
.statp .st-pips i.on{background:var(--green);border-color:var(--green)}
.statp .st-pips.lg i{width:14px;height:14px}

/* 3. follow-through charts: shared x across rate columns and energy line */
.statp .st-chs{display:flex;flex-direction:column;gap:6px;min-width:0}
.statp .st-cl{font:500 .8rem/1 var(--mono);letter-spacing:0;color:var(--faint);text-transform:none;padding-left:38px}
.statp .st-cl2{display:flex;justify-content:space-between;gap:10px;margin-top:10px}
.statp .st-ch{display:grid;grid-template-columns:32px minmax(0,1fr);column-gap:6px}
.statp .st-yl{position:relative;font:400 .75rem/1 var(--mono);color:var(--faint);font-variant-numeric:tabular-nums}
.statp .st-yl span{position:absolute;right:0;transform:translateY(-50%);white-space:nowrap}
.statp .st-plot{position:relative}
.statp .st-rate{height:56px;border-bottom:1px solid var(--faint)}
.statp .st-en{height:40px}
.statp .st-gl{position:absolute;left:0;right:0;border-top:1px solid var(--rule)}
.statp .st-cols{position:absolute;inset:0;display:flex}
.statp .st-cols span{flex:1 1 0;display:flex;align-items:flex-end;justify-content:center;min-width:0}
.statp .st-cols i{display:block;width:58%;max-width:18px;background:var(--dim)}
.statp .st-cols span:hover i{background:var(--ink)}
.statp .st-en svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.statp .st-en polyline{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
.statp .st-dot{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 2px var(--bg);transform:translate(-50%,-50%)}
.statp .st-xl{display:flex;justify-content:space-between;font:400 .75rem/1 var(--mono);letter-spacing:0;color:var(--faint);padding-top:2px}

/* 4. queue */
.statp .st-q{gap:10px}
.statp .st-qs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;margin:0;background:var(--rule)}
.statp .st-qs div{background:var(--bg);padding:9px 8px;display:flex;flex-direction:column;gap:7px;min-width:0}
.statp .st-qs dt{font:400 .8rem/1 var(--mono);letter-spacing:0;color:var(--dim);text-transform:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.statp .st-qs dd{margin:0;font:700 1.05rem/1 var(--mono);color:var(--ink)}
.statp .st-qs dd.z{color:var(--faint)}

@container st (max-width:479px){.statp .st-qs{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* wide container (computer): two columns, follow-through spans with figures beside its charts */
@container st (min-width:720px){
  .statp .st-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"load bal" "load q" "fol fol";grid-template-rows:auto 1fr auto}
  .statp .st-sec{padding:16px 18px 18px}
  .statp .st-load{grid-area:load}.statp .st-bal{grid-area:bal}.statp .st-q{grid-area:q}.statp .st-fol{grid-area:fol}
  .statp .st-fol{display:grid;grid-template-columns:minmax(170px,220px) minmax(0,1fr);gap:12px 28px;align-items:start}
  .statp .st-fol>.st-hd{grid-column:1/-1}
  .statp .st-fol>.st-figs{flex-direction:column;gap:18px}
  .statp .st-fol>.st-empty{grid-column:2;align-self:center}
}
/* time log */
.timep .body{display:flex;flex-direction:column;gap:12px}
.lt{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.seg2{display:flex;border:1px solid var(--rule)}
.seg2 button{background:transparent;border:0;color:var(--dim);font:500 .8rem/1 var(--mono);letter-spacing:0;padding:8px 10px;min-height:36px}
.seg2 button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.hgrid{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:4px 3px}
.hcell{display:flex;flex-direction:column;align-items:stretch;gap:3px;min-width:0}
.hcell i{font:400 .8rem/1 var(--mono);font-style:normal;color:var(--dim);text-align:center;font-variant-numeric:tabular-nums}
.hc{width:100%;height:40px;border:1px solid var(--rule);background:transparent;color:var(--dim);font:500 .8rem/1 var(--mono);letter-spacing:0;padding:0}
.hc.goal{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.hc.life{background:color-mix(in srgb,var(--dim) 32%,transparent);border-color:var(--dim);color:var(--ink)}
.hc.sleep{background:var(--panel2);border-color:var(--faint);color:var(--dim)}
.hc.rot{background:var(--red);border-color:var(--red);color:var(--bg)}
.hc.miss{border-style:dashed;border-color:var(--amber)}
.hc.now{outline:2px solid var(--cyan);outline-offset:1px}
.hc:disabled{opacity:.28;cursor:default}
.brushes{display:flex;flex-wrap:wrap;gap:6px}
.bc{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);background:transparent;color:var(--dim);font:500 .8rem/1 var(--mono);letter-spacing:0;padding:8px 9px;min-height:40px}
.bc[aria-pressed="true"]{border-color:var(--cyan);color:var(--ink);box-shadow:inset 0 0 0 1px var(--cyan)}
.sw{width:10px;height:10px;border:1px solid var(--dim);flex:none}
.sw.goal{background:var(--ink);border-color:var(--ink)}.sw.life{background:color-mix(in srgb,var(--dim) 32%,transparent)}.sw.sleep{background:var(--panel2)}.sw.rot{background:var(--red);border-color:var(--red)}
.tsplit{display:flex;height:12px;overflow:hidden}
.ts.goal{background:var(--ink)}.ts.life{background:color-mix(in srgb,var(--dim) 45%,transparent)}.ts.sleep{background:var(--panel2)}.ts.rot{background:var(--red)}.ts.miss{background:repeating-linear-gradient(45deg,transparent 0 3px,color-mix(in srgb,var(--amber) 55%,transparent) 3px 5px)}
.tleg{display:flex;flex-wrap:wrap;gap:4px 14px;font:400 .8rem/1.4 var(--mono);letter-spacing:0;color:var(--dim)}
.tleg b{color:var(--ink)}.tleg .r,.tleg .r b{color:var(--red)}
.rotl{font:500 .8rem/1.4 var(--mono);letter-spacing:0}
.rotl.g{color:var(--green)}.rotl.c{color:var(--amber)}.rotl.w{color:var(--red)}
.gps{display:flex;flex-direction:column;gap:8px}
.gp{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:10px;align-items:center;font:500 .8rem/1 var(--mono);letter-spacing:0;color:var(--dim)}
.gp .bar{position:relative;height:6px;background:var(--rule)}
.gp .fill{position:absolute;left:0;top:0;bottom:0;background:var(--ink)}
.gp .tick{position:absolute;top:-4px;bottom:-4px;border-left:1.5px solid var(--dim)}
.gp .v{white-space:nowrap}.gp .v.c{color:var(--amber)}.gp .v.g{color:var(--green)}
/* footer */
.loop{border:1px solid var(--red);color:var(--red);padding:9px 12px;font:500 .8rem/1.4 var(--mono);letter-spacing:0}
.loop[hidden]{display:none}

/* phone tab bar + capture sheet */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--panel);border-top:1px solid var(--rule);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px))}
.tab{background:none;border:0;color:var(--dim);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:60px;padding:8px 0 6px;font:500 .8rem/1 var(--mono);letter-spacing:0;position:relative}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:-1px;left:22%;right:22%;border-top:2px solid var(--ink)}
.tab .pl{width:46px;height:46px;border:1.5px solid var(--cyan);color:var(--cyan);display:grid;place-items:center}
.tab .pl svg{width:24px;height:24px}
.bd{position:absolute;top:6px;left:calc(50% + 8px);font:500 .8rem/1 var(--mono);padding:3px 4px;min-width:16px;background:var(--ink);color:var(--bg);letter-spacing:0}
.bd.c{background:var(--amber)}
.bd.w{background:var(--red)}
.scrim{position:fixed;inset:0;z-index:25;background:color-mix(in srgb,var(--bg) 72%,transparent)}
.sheet{position:fixed;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--panel2);border-top:1.5px solid var(--cyan);padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* info sheet */
.iscrim{position:fixed;inset:0;z-index:54;background:color-mix(in srgb,var(--bg) 60%,transparent)}
.isheet{position:fixed;left:0;right:0;bottom:0;z-index:55;max-height:75vh;overflow:auto;background:var(--panel2);border-top:1.5px solid var(--cyan);padding-top:6px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.isheet .ihd{display:flex;justify-content:space-between;align-items:center;gap:10px}
.isheet h3{margin:0;font:500 .8rem/1 var(--mono);letter-spacing:0;color:var(--dim);text-transform:none}
.isheet p{margin:6px 0 10px;font-size:.95rem;line-height:1.5;max-width:62ch}
.isheet p:last-child{margin-bottom:0}
.isheet b{font-weight:700}
.ic-green{color:var(--green)}.ic-amber{color:var(--amber)}.ic-red{color:var(--red)}.ic-cyan{color:var(--cyan)}.ic-magenta{color:var(--magenta)}.ic-ink{color:var(--ink)}
@media (min-width:1000px){
  .iscrim{background:transparent}
  .isheet{position:absolute;right:auto;bottom:auto;width:min(400px,calc(100vw - 32px));max-height:none;border:1px solid var(--rule);border-top:2px solid var(--cyan);padding:6px 16px 16px;box-shadow:0 14px 36px rgba(0,0,0,.55)}
  .isheet.ctr{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%)}
}

/* breakpoints */
@media (max-width:999px){
  #app{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));gap:12px}
  .mast,.only-desk{display:none!important}
  .statw{display:contents}
  .p.now{order:1}.p.plan{order:2}.p.habp{order:3}.p.prop{order:4}.p.objp{order:5}.p.upcp{order:6}.p.wcalp{order:6}.p.timep{order:7}.p.statp{order:8}.p.stat{order:9}.p.ccp{order:10}.p.capp{order:11}.p.shut{order:12}
  #app[data-tab="today"] .p:not([data-tab~="today"]),
  #app[data-tab="week"] .p:not([data-tab~="week"]),
  #app[data-tab="stats"] .p:not([data-tab~="stats"]),

@media (min-width:640px) and (max-width:999px){#app{max-width:720px}}
@media (min-width:1000px){
  body{font-size:16px}
  .pbar,.tabbar,.sheet,.scrim,.only-phone,.pstrip{display:none!important}
  .grid{display:grid;grid-template-columns:minmax(280px,1fr) minmax(0,2.4fr) minmax(280px,1fr);gap:16px;align-items:start}
  .col{display:flex;flex-direction:column;gap:16px;min-width:0}
  /* TODAY (console): today | week + year | suggested, this week, goals. STATS: time log | stats. */
  #app[data-view="console"] .statw{display:none}
  #app[data-view="stats"] .col.a,#app[data-view="stats"] .col.b,#app[data-view="stats"] .col.c{display:none}
  #app[data-view="stats"] .statw{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
}
.hc,.bc,.gp,.tleg,.timep .lbl,.timep .seg2 button,.timep .btn.sm{font-size:.8rem}.timep .seg2 button{min-height:40px}.rotl{font-size:.8rem}
@media (max-width:999px){.hgrid{grid-template-columns:repeat(6,minmax(0,1fr));gap:6px 4px}.hc{height:44px}}

/* ---- modules: tell, tasks, weekcal ---- */
/* TELL CLAUDE: one box for logs, tasks, replans and questions. Desktop bar (.tcbar) + phone overlay (.tc-sheet).
   Chips: green = applied, cyan = proposal to confirm (tappable), amber = not done / caution, dim = parked in inbox. */
.tcbar .ph h2,.tc-hd h2{font:500 .8rem/1 var(--mono);letter-spacing:0;color:var(--dim);text-transform:none;margin:0;white-space:nowrap}
.tcbar .ph .tc-r{display:flex;align-items:center;gap:8px;font:inherit;letter-spacing:0;text-transform:none}
.tcbar .body{display:flex;flex-direction:column;gap:12px}
.tcbar .tc-s,.tc-sheet .tc-s{display:inline-block;font:500 .8rem/1 var(--mono);letter-spacing:0;padding:5px 7px;border:1px solid currentColor;white-space:nowrap}
.tcbar .tc-s.m,.tc-sheet .tc-s.m{color:var(--magenta)}
.tcbar .tc-s.a,.tc-sheet .tc-s.a{color:var(--amber)}
.tcbar .tc-f,.tc-sheet .tc-f{display:flex;gap:8px;align-items:flex-end;margin:0}
.tcbar .tc-f textarea,.tc-sheet .tc-f textarea{flex:1;min-width:0;min-height:44px;max-height:168px;resize:none;field-sizing:content;font:16px/1.4 var(--sans);padding:10px 12px}
.tcbar .btn,.tc-sheet .btn{font-size:.8rem}
.tcbar .tc-f .btn,.tc-sheet .tc-f .btn{flex:none;min-height:44px;min-width:76px}
.tcbar .tc-f .btn:not(.fill),.tc-sheet .tc-f .btn:not(.fill){border-color:var(--magenta);color:var(--magenta)}
.tcbar .tc-last{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--rule);padding-top:10px}
.tcbar .tc-m,.tc-sheet .tc-m{display:flex;flex-direction:column;gap:6px;min-width:0}
.tcbar .tc-m i,.tc-sheet .tc-m i{font:500 .8rem/1 var(--mono);font-style:normal;letter-spacing:0;color:var(--faint)}
.tcbar .tc-m p,.tc-sheet .tc-m p{margin:0;font-size:.95rem;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.tcbar .tc-m.u p,.tc-sheet .tc-m.u p{color:var(--dim)}
.tcbar .tc-m.c,.tc-sheet .tc-m.c{border-left:2px solid var(--rule);padding-left:10px}
.tcbar .tc-m.live,.tc-sheet .tc-m.live{border-left-color:var(--magenta)}
.tcbar .tc-m .tc-note,.tc-sheet .tc-m .tc-note{color:var(--dim);font-size:.88rem}
.tcbar .tc-m .tc-note.a,.tc-sheet .tc-m .tc-note.a{color:var(--amber)}
.tcbar .tc-last .tc-m.u p{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tcbar .tc-chips,.tc-sheet .tc-chips{display:flex;flex-wrap:wrap;gap:6px}
.tcbar .tc-chip,.tc-sheet .tc-chip{display:inline-flex;align-items:center;min-height:32px;max-width:100%;padding:6px 10px;border:1px solid currentColor;background:transparent;font:500 .8rem/1.25 var(--mono);letter-spacing:0;text-align:left;overflow-wrap:anywhere;color:var(--green)}
.tcbar .tc-chip.a,.tc-sheet .tc-chip.a{color:var(--amber)}
.tcbar .tc-chip.d,.tc-sheet .tc-chip.d{color:var(--dim);border-color:var(--rule)}
.tcbar .tc-chip.c,.tc-sheet .tc-chip.c{color:var(--cyan);cursor:pointer}
.tcbar .tc-chip.c::after,.tc-sheet .tc-chip.c::after{content:"\00a0›"}
.tcbar .tc-chips.undone .tc-chip:not(.tc-ud):not(.tc-more),.tc-sheet .tc-chips.undone .tc-chip:not(.tc-ud):not(.tc-more){text-decoration:line-through;color:var(--faint)}
.tc-scrim{position:fixed;inset:0;z-index:25;background:color-mix(in srgb,var(--bg) 72%,transparent)}
.tc-sheet{position:fixed;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 120px);max-height:calc(100dvh - 120px - env(safe-area-inset-bottom,0px));background:var(--panel2);border-top:1.5px solid var(--cyan);padding-top:12px;padding-bottom:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tc-sheet .tc-hd{display:flex;align-items:center;gap:8px;min-width:0}
.tc-sheet .tc-sp{flex:1}
.tc-sheet .tc-xs{display:flex;flex-direction:column-reverse;overflow:auto;min-height:0;max-height:46vh;overscroll-behavior:contain}
.tc-sheet .tc-xs>div{display:flex;flex-direction:column;gap:14px}
@media (max-width:999px){
  .p.tcbar{order:8}
  .tcbar .tc-chip.c,.tc-sheet .tc-chip.c{min-height:40px}
  #app:has(.tc-sheet) .toast{bottom:auto;top:calc(10px + env(safe-area-inset-top,0px))}
}
@media (max-width:359px){.tc-sheet .tc-hd .btn.sm{padding:6px 8px}.tcbar .tc-f .btn,.tc-sheet .tc-f .btn{min-width:64px;padding:8px 10px}}
@media (min-width:1000px){
  .tc-sheet{left:50%;right:auto;top:50%;bottom:auto;transform:translate(-50%,-50%);width:min(620px,92vw);max-height:80vh;border:1px solid var(--rule);border-top:2px solid var(--cyan);padding:16px 22px 20px}
  .tcbar .tc-last{max-height:320px;overflow:auto;position:relative;padding-right:84px}
  .tcbar .tc-hide{position:absolute;right:0;top:8px}
  .tcbar{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:start;column-gap:8px;border-top:0}
  .tcbar .ph{padding:14px 12px 12px;min-height:60px}
  .tcbar .body{padding:8px 12px 12px 0}
  .tcbar .tc-f,.tcbar .tc-last{max-width:760px}
  #app[data-view="tasks"] .tcbar,#app[data-view="stats"] .tcbar{display:none}
}

/* TASKS module. Selectors scoped under .taskp (section) and .tk-d (detail sheet content). Tokens only.
   Values ink, labels dim, due amber (2 days or less) / red (overdue), done green, controls cyan. Nothing under 12px. */
.taskp{container:tk/inline-size}
.taskp .ph h2,.taskp .ph>span{font-size:.8rem}
.taskp .tk-h{display:flex;align-items:center;gap:10px;min-width:0}

/* sort + filter */
.taskp .tk-ctl{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--rule)}
.taskp .tk-seg{display:flex;border:1px solid var(--rule);min-width:0}
.taskp .tk-seg button{background:transparent;border:0;color:var(--dim);font:500 .8rem/1 var(--mono);letter-spacing:0;padding:0 10px;min-height:40px}
.taskp .tk-seg button+button{border-left:1px solid var(--rule)}
.taskp .tk-seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.taskp .tk-empty{padding:16px 12px;font:400 .8rem/1.5 var(--mono);color:var(--dim)}

/* groups */
.taskp .tk-g{border-bottom:1px solid var(--rule);min-width:0}
.taskp .tk-g:last-child{border-bottom:0}
.taskp .tk-gh{display:flex;align-items:stretch;background:var(--panel2)}
.taskp .tk-gt{flex:1;min-width:0;display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;background:none;border:0;text-align:left;color:var(--ink)}
.taskp .tk-gt svg{width:14px;height:14px;flex:none;fill:none;stroke:var(--dim);stroke-width:2;transition:transform .15s}
.taskp .tk-gt[aria-expanded="false"] svg{transform:rotate(-90deg)}
.taskp .tk-gt b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:500 .8rem/1.2 var(--mono);letter-spacing:0;text-transform:none}
.taskp .tk-gt .tk-n{margin-left:auto;font:500 .8rem/1 var(--mono);color:var(--dim);font-variant-numeric:tabular-nums}
.taskp .tk-gt:hover b{color:var(--cyan)}
.taskp .tk-plus{flex:none;width:48px;border:0;border-left:1px solid var(--rule);background:none;color:var(--cyan);font:400 1.4rem/1 var(--mono);padding:0}
.taskp .tk-addf{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 8px 8px 12px;border-top:1px solid var(--rule)}
.taskp .tk-addf input{flex:1;min-width:0}
.taskp .tk-addf .x{min-width:44px;min-height:44px;color:var(--dim)}

/* rows */
.taskp .tk-rows{list-style:none;margin:0;padding:0}
.taskp .tk-r,.tk-d .tk-r{display:grid;grid-template-columns:48px minmax(0,1fr);align-items:stretch;border-top:1px solid var(--rule);min-width:0}
.taskp .tk-r.sub{margin-left:24px;border-left:1px solid var(--rule);grid-template-columns:44px minmax(0,1fr)}
.taskp .tk-cb,.tk-d .tk-cb{display:grid;place-items:center;align-self:stretch;min-height:48px;padding:0;background:none;border:0;cursor:pointer}
.taskp .tk-cb i,.tk-d .tk-cb i{display:grid;place-items:center;width:22px;height:22px;border:1.5px solid var(--dim);transition:background-color .2s ease-out,border-color .2s ease-out}
.taskp .tk-cb[aria-checked="true"] i,.tk-d .tk-cb[aria-checked="true"] i{background:var(--green);border-color:var(--green)}
.tk-cb i svg{width:14px;height:14px;fill:none;stroke:#0f0f11;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.tk-cb i path{stroke-dasharray:22;stroke-dashoffset:22;transition:stroke-dashoffset .25s ease-out}
.tk-cb[aria-checked="true"] i path{stroke-dashoffset:0;transition-delay:.05s}
.taskp .tk-cb:hover i,.tk-d .tk-cb:hover i{border-color:var(--cyan)}
.taskp .tk-tb,.tk-d .tk-tb{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:10px;row-gap:5px;align-items:start;width:100%;min-width:0;padding:12px 12px 12px 0;background:none;border:0;text-align:left;color:inherit;font:inherit;cursor:pointer}
.taskp .tk-tt,.tk-d .tk-tt{grid-column:1;min-width:0;font-size:.95rem;line-height:1.35;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.taskp .tk-r.sub .tk-tt,.tk-d .tk-r.sub .tk-tt{font-size:.9rem}
.taskp .tk-tb:hover .tk-tt,.tk-d .tk-tb:hover .tk-tt{color:var(--cyan)}
.taskp .tk-mt,.tk-d .tk-mt{grid-column:1;display:flex;flex-wrap:wrap;gap:3px 12px;min-width:0;font:500 .8rem/1.3 var(--mono);letter-spacing:0;color:var(--dim)}
.taskp .tk-mt span,.tk-d .tk-mt span{min-width:0;overflow-wrap:anywhere}
.taskp .tk-mt .tk-ctx,.taskp .tk-mt .tk-pj,.tk-d .tk-mt .tk-ctx,.tk-d .tk-mt .tk-pj{color:var(--faint);text-transform:none;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.taskp .tk-mt .tk-ctx,.tk-d .tk-mt .tk-ctx{text-transform:none;letter-spacing:0;font-family:var(--sans);font-weight:400}
.taskp .tk-mt .tk-pg.ok,.tk-d .tk-mt .tk-pg.ok{color:var(--green)}
.taskp .tk-mt .tk-on,.tk-d .tk-mt .tk-on{color:var(--ink)}
.taskp .tk-mt .tk-on.pr,.tk-d .tk-mt .tk-on.pr{color:var(--cyan)}
.taskp .tk-du,.tk-d .tk-du{grid-column:2;grid-row:1 / span 2;font:500 .8rem/1.35 var(--mono);letter-spacing:0;color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums}
.taskp .tk-du.c,.tk-d .tk-du.c{color:var(--amber)}.taskp .tk-du.w,.tk-d .tk-du.w{color:var(--red)}.taskp .tk-du.dn,.tk-d .tk-du.dn{color:var(--faint)}
.taskp .tk-r.done .tk-tt,.tk-d .tk-r.done .tk-tt{color:var(--dim)}
.taskp .tk-ask{display:flex;flex-direction:column;gap:8px;padding:10px 12px 12px 48px;border-top:1px dashed var(--amber);font:500 .8rem/1.4 var(--mono);letter-spacing:0;color:var(--amber)}
.taskp .tk-ab,.tk-d .tk-ab{display:flex;flex-wrap:wrap;gap:8px}
@media (max-width:999px){.taskp .tk-ab .btn.sm,.tk-d .tk-ab .btn.sm,.tk-d .tk-f .btn.sm{min-height:40px}}

/* computer: groups flow into columns in the full-width TASKS view */
@container tk (min-width:820px){
  .taskp .tk-gs{columns:2;column-gap:0;column-rule:1px solid var(--rule)}
  .taskp .tk-g{break-inside:avoid;border-bottom:1px solid var(--rule)}
  .taskp .tk-g:last-child{border-bottom:1px solid var(--rule)}
}
@container tk (min-width:1240px){.taskp .tk-gs{columns:3}}

/* detail sheet content */
.tk-d .tk-crumb{display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px;font:500 .8rem/1.4 var(--mono);letter-spacing:0;color:var(--dim);text-transform:none;margin-top:2px}
.tk-d .tk-crumb i{font-style:normal;color:var(--faint)}
.tk-d .tk-cr{background:none;border:0;padding:0;min-height:32px;color:var(--cyan);font:400 .9rem/1.3 var(--sans);letter-spacing:0;text-transform:none;text-align:left;overflow-wrap:anywhere}
.tk-d h3{overflow-wrap:anywhere}
.tk-d h3.tk-x{color:var(--dim)}
.tk-d .tk-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;font:500 .8rem/1.5 var(--mono);letter-spacing:0;color:var(--ink)}
.tk-d .tk-meta b{color:var(--dim);margin-right:6px;font-weight:700}
.tk-d .tk-meta .tag{font-size:.8rem}
.tk-d .tk-md.c{color:var(--amber)}.tk-d .tk-md.w{color:var(--red)}.tk-d .tk-md.dn{color:var(--dim)}
.tk-d .tk-meta .tk-on{color:var(--ink);border:1px solid var(--rule);padding:2px 6px}
.tk-d .tk-dd{font-size:.98rem;line-height:1.55;margin:12px 0;max-width:62ch;white-space:pre-wrap;overflow-wrap:anywhere}
.tk-d .tk-nd{color:var(--dim)}
.tk-d .tk-sh{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font:500 .8rem/1 var(--mono);letter-spacing:0;color:var(--dim)}
.tk-d .tk-sh b{color:var(--ink)}.tk-d .tk-sh b.ok{color:var(--green)}
.tk-d .tk-subs{list-style:none;margin:8px 0 0;padding:0}
.tk-d .tk-subs .tk-r:first-child{border-top:1px solid var(--rule)}
.tk-d .tk-box{margin-top:14px;padding:12px 0 0;border-top:1px solid var(--rule);display:flex;flex-direction:column;gap:8px}
.tk-d .tk-box.c{border-color:var(--amber)}
.tk-d .tk-bt{font:500 .8rem/1.4 var(--mono);letter-spacing:0;color:var(--dim)}
.tk-d .tk-box.c .tk-bt{color:var(--amber)}
.tk-d .tk-pm{font:500 .85rem/1.5 var(--mono);letter-spacing:0;color:var(--ink)}
.tk-d .tk-pw{font-size:.9rem;color:var(--dim)}
.tk-d .tk-cf .tk-ab{margin-top:10px}
.tk-d .tk-pri,.tk-d .tk-sec{display:grid;grid-template-columns:repeat(auto-fit,minmax(124px,1fr));gap:8px;margin-top:14px}
.tk-d .tk-sec{margin-top:8px}
.tk-d .tk-sec .btn{padding-left:8px;padding-right:8px}
.tk-d .tk-sec .btn[aria-expanded="true"]{border-color:var(--cyan);color:var(--cyan)}
.tk-d .tk-f{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;margin-top:12px;padding-top:12px;border-top:1px solid var(--rule)}
.tk-d .tk-f input[type=text]{flex:1 1 180px}
.tk-d .tk-f label{display:flex;flex-direction:column;gap:5px;min-width:0;font:500 .8rem/1 var(--mono);letter-spacing:0;color:var(--dim)}
.tk-d .tk-mv label{flex:1 1 200px}
.tk-d select{width:100%;max-width:100%;min-height:40px;padding:8px;border:1px solid var(--rule);border-radius:8px;background:var(--bg);color:var(--ink);font:16px/1.2 var(--sans)}
.tk-d select:focus,.tk-d input[type=date]:focus{border-color:var(--cyan);outline:none}
.tk-d select:disabled{opacity:.5}

/* urgency: NOW / THIS WEEK / LATER chips in the add form and the detail sheet; rows show NOW as an ink tag, THIS WEEK dim, LATER nothing */
.taskp .tk-ug,.tk-d .tk-ug{display:flex;flex-wrap:wrap;align-items:center;gap:6px;min-width:0}
.taskp .tk-ug button,.tk-d .tk-ug button{min-height:40px;padding:0 12px;border:1px solid var(--rule);background:transparent;color:var(--dim);font:500 .8rem/1 var(--mono);letter-spacing:0;white-space:nowrap}
.taskp .tk-ug button[aria-pressed="true"],.tk-d .tk-ug button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink)}
.taskp .tk-ug button:hover,.tk-d .tk-ug button:hover{border-color:var(--cyan);color:var(--cyan)}
.tk-d .tk-ug{margin-top:12px}
.tk-d .tk-ul{font:500 .8rem/1 var(--mono);letter-spacing:0;color:var(--dim);margin-right:4px}
.taskp .tk-addf .tk-ai{display:flex;flex:1 1 100%;gap:8px;align-items:center;min-width:0}
.taskp .tk-mt .tk-ut,.tk-d .tk-mt .tk-ut{color:var(--dim);padding:2px 4px;letter-spacing:0}
.taskp .tk-mt .tk-ut.now,.tk-d .tk-mt .tk-ut.now{color:var(--ink)}
@media (max-width:999px){.taskp .tk-ug button,.tk-d .tk-ug button{min-height:44px}}

/* projects: ⋯ on a group header opens the group's own panel (rename, move, merge, make it a task, delete); + NEW PROJECT closes the list */
.taskp .tk-pmb{flex:none;width:44px;min-height:44px;border:0;border-left:1px solid var(--rule);background:none;color:var(--cyan);font:700 1.1rem/1 var(--mono);padding:0}
.taskp .tk-pmb[aria-expanded="true"]{background:var(--cyan);color:var(--bg)}
.taskp .tk-pp{display:flex;flex-direction:column;gap:10px;padding:10px 12px 12px;border-top:1px solid var(--rule)}
.taskp .tk-pb{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.taskp .tk-pp .btn{min-height:44px;padding:8px 10px;white-space:normal;line-height:1.3;text-align:center}
.taskp .tk-pp .btn[aria-expanded="true"]{border-color:var(--ink);color:var(--ink)}
.taskp .tk-pp .confirm{margin-top:0}
.taskp .tk-cf .tk-ab{margin-top:10px}
.taskp .tk-f{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.taskp .tk-f input[type=text]{flex:1 1 160px}
.taskp .tk-f label{display:flex;flex-direction:column;gap:5px;flex:1 1 160px;min-width:0;font:500 .8rem/1 var(--mono);letter-spacing:0;color:var(--dim)}
.taskp .tk-f .x{min-width:44px;min-height:44px;color:var(--dim)}
.taskp select{width:100%;min-height:40px;padding:8px;border:1px solid var(--rule);border-radius:8px;background:var(--bg);color:var(--ink);font:16px/1.2 var(--sans)}
.taskp select:focus{border-color:var(--cyan);outline:none}
.taskp .tk-pn{padding:10px 12px 12px;border-top:1px solid var(--rule)}
.taskp .tk-pn .tk-f{max-width:640px}

/* WEEK CALENDAR module. Scoped under .wcalp (the section), .wc-tg (LIST | CALENDAR toggle, also placed in other
   headers) and .wc-scrim / .wc-evs (event sheet). Google events neutral grey, tasks ink, proposals dashed cyan,
   now magenta, caution amber. Text 12px and up, hour labels included. */
.wc-tg{display:inline-flex;border:1px solid var(--rule);flex:none}
.wc-tg button{background:transparent;border:0;color:var(--cyan);font:500 .8rem/1 var(--mono);letter-spacing:0;padding:8px 10px;min-height:34px;cursor:pointer}
.wc-tg button+button{border-left:1px solid var(--rule)}
.wc-tg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.wcalp{container:wcal/inline-size}
.wcalp .ph{gap:8px}
.wcalp .ph h2{font-size:.8rem}
.wcalp .wc-hl{display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:wrap}
.wcalp .wc-hr{display:flex;align-items:center;gap:6px;margin-left:auto}
.wcalp .wc-sy{display:inline-flex;align-items:center;gap:6px;background:transparent;border:1px solid var(--rule);color:var(--dim);font:500 .8rem/1 var(--mono);letter-spacing:0;padding:6px 7px;min-height:32px;white-space:nowrap;cursor:pointer}
.wcalp .wc-sy.g{color:var(--green);border-color:color-mix(in srgb,var(--green) 45%,transparent)}
.wcalp .wc-sy.c{color:var(--amber);border-color:var(--amber)}
.wcalp .wc-dot{display:block;width:7px;height:7px;border-radius:50%;background:currentColor}
.wcalp .wc-ns{padding:10px 12px;border-bottom:1px solid var(--rule);font:500 .8rem/1.5 var(--mono);letter-spacing:0;color:var(--amber)}
.wcalp .wc-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.wcalp .wc-tag{display:inline-block;font:500 .8rem/1 var(--mono);letter-spacing:0;padding:3px 5px;border:1px solid currentColor;color:var(--dim);white-space:nowrap}
.wcalp .wc-tag.cy{color:var(--cyan);border-color:transparent;padding-left:0;padding-right:0}.wcalp .wc-tag.c{color:var(--amber)}.wcalp .wc-tag.g{color:var(--green)}.wcalp .wc-tag.m{color:var(--magenta)}

/* agenda (phone, narrow containers) */
.wcalp .wc-day{padding:0 12px 12px}
.wcalp .wc-day+.wc-day{border-top:1px solid var(--rule)}
.wcalp .wc-dh{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;margin:0;padding:14px 0 8px;font:500 .8rem/1.2 var(--mono);letter-spacing:0;color:var(--dim)}
.wcalp .wc-dh b{color:var(--ink);font-size:.8rem;letter-spacing:0}
.wcalp .wc-day.td .wc-dh b{color:var(--magenta)}
.wcalp .wc-dh em,.wcalp .wc-gd em{font:500 .8rem/1.2 var(--mono);font-style:normal;letter-spacing:0;color:var(--amber)}
.wcalp .wc-rs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.wcalp .wc-r{display:grid;grid-template-columns:50px minmax(0,1fr);gap:10px;align-items:start;width:100%;min-height:44px;margin:0;padding:9px 10px;text-align:left;border:1px solid color-mix(in srgb,var(--dim) 30%,transparent);background:color-mix(in srgb,var(--dim) 12%,var(--panel));color:var(--ink);font:inherit;font-size:.95rem;line-height:1.35}
.wcalp button.wc-r{cursor:pointer}
.wcalp button.wc-r:hover .wc-tx{color:var(--cyan)}
.wcalp .wc-tm{display:flex;flex-direction:column;gap:2px;font:500 .85rem/1.3 var(--mono);font-variant-numeric:tabular-nums;color:var(--dim);white-space:nowrap}
.wcalp .wc-tm i{font-style:normal;font-weight:400;color:var(--faint)}
.wcalp .wc-tx{min-width:0;overflow-wrap:anywhere}
.wcalp .wc-tx small{display:block;margin-top:2px;font:400 .8rem/1.4 var(--mono);color:var(--dim)}
.wcalp .wc-r.free{background:transparent;border-style:dotted}
.wcalp .wc-r.free .wc-tx{color:var(--dim)}
.wcalp .wc-r.task{background:var(--panel);border-color:color-mix(in srgb,var(--ink) 55%,transparent);box-shadow:inset 3px 0 0 var(--ink)}
.wcalp .wc-r.task .wc-tx{font-weight:700}
.wcalp .wc-r.task .wc-tm{color:var(--ink)}
.wcalp .wc-r.prop{background:transparent;border:1.5px dashed var(--cyan)}
.wcalp .wc-r.prop .wc-tx{font-weight:700}
.wcalp .wc-r.on{border-color:var(--magenta);box-shadow:inset 3px 0 0 var(--magenta)}
.wcalp .wc-r.on .wc-tm{color:var(--magenta)}
.wcalp .wc-r.late{box-shadow:inset 3px 0 0 var(--amber)}

  if(/refund|reimburs|expense|form|fafsa|application|apply/.test(l))return 45;if(/email|message|text|call|reply|follow.?up|thank/.test(l))return 15;if(/study|review|homework|\bhw\b|write|draft|essay|report/.test(l))return 90;return 30;}

/* 1. LOAD: committed minutes per day for the next 7 days vs focus capacity */
function st_load(t0,f){
  var P=S.planned||[],its=f&&S.today&&S.today.items?S.today.items:[],ids={},days=[],tot=0,cap=0,over=0,worst='',top=60,empty=0,i,j;
  for(j=0;j<its.length;j++)ids[its[j].id]=1;
  for(i=0;i<7;i++){
    var d=st_add(t0,i),ds=iso(d),m=0,c=Math.max(0,+capMin(d)||0);
    if(i===0)for(j=0;j<its.length;j++)if(!its[j].done)m+=itemMin(its[j]);
    for(j=0;j<P.length;j++){var p=P[j];if(p&&p.date===ds&&!(i===0&&p.id&&ids[p.id]))m+=itemMin(p);}
    var r=c?m/c:(m?9:0),lv=r>1.25?'w':r>1?'c':'';
    if(lv){over++;if(lv==='w'||!worst)worst=lv;}
    if(i>0&&!m)empty++;
    tot+=m;cap+=c;top=Math.max(top,m,c);
    days.push({d:d,m:m,c:c,r:r,lv:lv});
  }
  top=Math.ceil(top/60)*60;

  if(R>1||over>=2)v=['OVERLOADED','w'];
  else if(R>0.85||over)v=['HEAVY','c'];
  else if(R<0.6)v=['ROOM TO SPARE','g'];
  else v=['STEADY','n'];

  if(empty>=3&&(v[1]==='g'||v[1]==='n'))v=['PARTLY PLANNED','n'];
  var h='<div class="st-sec st-load">'+st_hd('Hours','',tot?st_vd(v):'');
  if(!tot)return h+'<p class="st-empty">Nothing scheduled.</p></div>';
  h+='<div class="st-fig"><b class="st-big">'+st_h(tot)+'</b><span class="st-of">of '+st_h(cap)+
    (over?'<br><em class="'+worst+'">'+over+' day'+(over>1?'s':'')+' over</em>':'')+'</span></div>';
  h+='<ul class="st-days">';
  for(i=0;i<7;i++){
    var x=days[i],tip=st_day(x.d,1)+': '+st_h(x.m)+' committed of '+st_h(x.c)+' capacity'+(x.c?' ('+Math.round(x.r*100)+'%)':'');
    h+='<li class="st-day'+(x.lv?' '+x.lv:'')+(i===0?' td':'')+'" title="'+esc(tip)+'">'+
      '<span class="st-dl">'+(i===0?'TODAY':st_day(x.d))+'</span>'+
      '<span class="st-trk" aria-hidden="true">'+(x.c?'<i class="st-cap" style="width:'+st_pct(x.c,top)+'"></i>':'')+
        (x.m?'<i class="st-bar" style="width:max(2px,'+st_pct(x.m,top)+')"></i>':'')+
        (x.c?'<i class="st-tick" style="left:'+st_pct(x.c,top)+'"></i>':'')+'</span>'+
      '<span class="st-dv">'+(x.lv?'<em>OVER</em>':'')+(x.m?st_h(x.m):'<s>–</s>')+'<span class="st-sr"> of '+st_h(x.c)+'</span></span></li>';
  }
  return h+'</ul></div>';
}

function habitInfo(g,arr,ti){

    var y=on(1),y2=on(2);

/* ---------- state hardening ---------- */
function tk_normalize(St){
  St=St||S;if(!St||typeof St!=='object')return St;
  var P0=Array.isArray(St.projects)?St.projects:[],pids={},projects=[];
  P0.forEach(function(p,k){
    if(typeof p==='string'||typeof p==='number')p={name:String(p)};
    if(!p||typeof p!=='object'||Array.isArray(p))return;
    var name=str(p.name!=null?p.name:(p.title!=null?p.title:p.t),60).replace(/\s+/g,' ').trim();
    var id=(typeof p.id==='string'||typeof p.id==='number')?String(p.id).trim().slice(0,40):'';
    if(!id)id=name.toLowerCase().replace(/[^a-z0-9]+/g,'').slice(0,24);if(!id)id='p'+k;
    if(!name)name=id;var base=id,n=2;while(pids[id])id=base+'_'+(n++);pids[id]=1;
    projects.push(Object.assign({},p,{id:id,name:name,g:normG(p.g)}));});
  projects=projects.slice(0,60);
  var T0=Array.isArray(St.tasks)?St.tasks:[],seen={},tasks=[];
  T0.forEach(function(x,k){
    if(typeof x==='string')x={t:x};
    if(!x||typeof x!=='object'||Array.isArray(x))return;
    var t=str(x.t!=null?x.t:(x.title!=null?x.title:x.name),200).replace(/\s+/g,' ').trim();if(!t)return;
    var id=(typeof x.id==='string'||typeof x.id==='number')?String(x.id).trim().slice(0,40):'';if(!id)id='k'+k;
    var base=id,n=2;while(seen[id])id=base+'_'+(n++);seen[id]=1;
    var st=typeof x.status==='string'?x.status.trim().toLowerCase():'',dn=/^(done|complete|completed|closed|finished)$/.test(st)||(!st&&bool(x.done));
    var m=Math.round(+x.m),par=x.parent!=null?x.parent:x.parentId,due=tk_date(x.due);
    var o=Object.assign({},x,{id:id,t:t,d:str(x.d!=null?x.d:x.notes,2000),proj:tk_projOf(x.proj!=null?x.proj:x.project,projects),
      parent:(typeof par==='string'||typeof par==='number')?String(par).trim().slice(0,40):'',g:normG(x.g),due:due,
      m:(m>0&&m<=1440)?m:0,status:dn?'done':'open',created:tk_date(x.created),doneOn:dn?tk_date(x.doneOn):'',urg:tk_urgOf(x.urg,due)});
    delete o.done;tasks.push(o);});
  /* parents: must exist and not be itself; break cycles; flatten to one level; subtasks share the parent's project */
  var by={};tasks.forEach(function(t){by[t.id]=t;});
  tasks.forEach(function(t){if(!t.parent||t.parent===t.id||!by[t.parent])t.parent='';});
  tasks.forEach(function(t){var vis={},cur=t;vis[t.id]=1;while(cur.parent){var p=by[cur.parent];if(vis[p.id]){cur.parent='';break;}vis[p.id]=1;cur=p;}});
  tasks.forEach(function(t){var r=t,g=0;while(r.parent&&g++<=tasks.length)r=by[r.parent];t.parent=r===t?'':r.id;});
  tasks.forEach(function(t){if(t.parent)t.proj=by[t.parent].proj;});
  /* cap: keep every open task (up to the cap), then the most recently finished */
  if(tasks.length>TK_MAX){var idx={},keep={},open=tasks.filter(function(t){return t.status!=='done';}),done=tasks.filter(tk_isDone);
    tasks.forEach(function(t,i){idx[t.id]=i;});
    done.sort(function(a,b){var x=a.doneOn||'',y=b.doneOn||'';return x!==y?(x<y?1:-1):idx[b.id]-idx[a.id];});
    open.slice(0,TK_MAX).concat(done).slice(0,TK_MAX).forEach(function(t){keep[t.id]=1;});

  lk(St.today&&St.today.items);lk(St.planned);lk(St.proposals);

}

/* a today / planned item linked to a task was ticked: finish the task (doneOn = working day).

function tk_onItemDone(it){

/* ---------- grouping ---------- */
function tk_units(filt){

/* ---------- scheduling ---------- */
function tk_fits(p){var o=ops();if(p.date===o.date&&!fresh())return false;
  var m=p.m||30;if(loadOn(p.date)+m>capMin(pd(p.date)))return false;var s=mins(p.s);if(s!==null&&(s<8*60||s+m>22*60+30||(p.date===o.date&&s<o.min+10)))return false;
  if(s!==null&&busyOn(p.date).some(function(b){return s<b[1]&&s+m>b[0];}))return false;return true;}
/* local slot finder: proposeLocal's rules (capacity in minutes, no overlap) with the task's own estimate */
function tk_local(t){
  var o=ops(),m=t.m>0?Math.min(480,t.m):guessMin(t.t),due=okDate(t.due)?t.due:'';
  for(var k=0;k<8;k++){var day=new Date(o.day.getFullYear(),o.day.getMonth(),o.day.getDate()+k),ds=iso(day),wk=day.getDay()===0||day.getDay()===6;
    if(k===0&&(!fresh()||o.min>20*60))continue;
    if(loadOn(ds)+m>capMin(day))continue;
    var start=k===0?Math.max(9*60,Math.ceil((o.min+15)/15)*15):(wk?11*60:16*60),bz=busyOn(ds);
    for(var st=start;st+m<=21*60+30;st+=15){var clash=bz.some(function(b){return st<b[1]&&st+m>b[0];});
      if(!clash)return {t:'',d:'',g:'',m:m,date:ds,s:m2h(st),e:m2h(st+m),why:due&&ds>due?'First open slot, but it lands after the due date.':k===0?'Open gap today after your current plan.':k===1?'Tomorrow has room for it.':'First day with room in the next week.'};}}
  var tm=new Date(o.day.getFullYear(),o.day.getMonth(),o.day.getDate()+1);
  return {t:'',d:'',g:'',m:m,date:iso(tm),s:'',e:'',why:'Your week is full, so this has no set time yet.'};
}
/* fill a slot with the task's title, notes, goal, estimate and link */
function tk_fill(x,p){p.t=str(x.t,120);if(x.d)p.d=str(x.d,1200);var g=tk_goal(x);if(g)p.g=g;if(x.m>0)p.m=Math.min(480,x.m);if(!(p.m>0))p.m=30;
  p.e=p.s?m2h(Math.min(1439,mins(p.s)+p.m)):'';p.task=x.id;return p;}
function tk_addProp(tid,p){var x=tk_find(tid);if(!x){render();return;}tk_fill(x,p);
  tk_act('Suggested '+dayLbl(p.date)+(p.s?' '+p.s:''),function(){addProposal(p);},true);}
function tk_schedule(t){
  var U=tk_ui(),tid=t.id,L=tk_links(tid);if(U.sched||L.today||L.planned||L.prop)return;
  if(!sample){tk_addProp(tid,tk_local(t));return;}
  if(busy){toast('Claude is busy. Try again in a moment.');render();return;}
  U.sched=tid;ui.proposing=true;busy=true;render();
  var prompt='You schedule tasks for Kevin Kyle (UMD aerospace senior; startup Spotter launches Nov 22, 2026; job hunting). He wants to schedule this task from his backlog: "'+t.t+'".'+
    (t.d?' Notes: '+t.d.slice(0,400):'')+(t.m>0?' His estimate: '+t.m+' minutes.':'')+(t.due?' Due '+t.due+'.':'')+'\n'+
    'Return ONLY a JSON object: {"m": realistic minutes to complete, "date": "YYYY-MM-DD", "s": start "HH:MM" 24h, "why": why this slot, max 90 chars}.\n'+
    'Pick the soonest sensible slot within 7 days'+(t.due?' and before the due date if possible':'')+' that does not overlap timed items, keeps each day within its capacity in minutes (today counts unfinished items, planned and pending ones), and avoids 22:30-08:00. Never overlap his calendar events (cal in the schedule). Prefer weekday 15:00-21:00 and weekend 10:00-18:00. Never invent facts about him.\nSchedule: '+JSON.stringify(schedContext());
  Promise.resolve().then(function(){return sample.json(prompt,{modelTier:'quick',cache:false});}).then(function(r){
    var x=tk_find(tid);if(!x||!r||typeof r!=='object')return null;r.t=x.t;var p=validProp(r,x.t);if(p&&x.m>0)p.m=Math.min(480,x.m);return p&&tk_fits(p)?p:null;
  },function(e){var c=e&&e.code;if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].indexOf(c)>=0)sample=null;return null;
  }).then(function(p){U.sched='';ui.proposing=false;busy=false;var x=tk_find(tid);
    if(x&&!tk_links(tid).prop)tk_addProp(tid,p||tk_local(x));else render();if(pending){pending=false;queueSave();}});
}
/* put a task on today's plan (or in planned for today when the plan hasn't rolled yet); drops its pending slot. Returns the toast text. */
function tk_pushToday(t){var o=ops(),ids={};ids[t.id]=1;var base={t:str(t.t,120),d:str(t.d,1200),g:tk_goal(t),task:t.id};tk_unlinkSched(ids);
  if(!fresh()){S.planned.push(Object.assign({id:'p'+Date.now().toString(36)+Math.floor(Math.random()*1e3),date:o.date,s:'',e:'',m:t.m>0?t.m:30},base));return 'Will be in today’s plan';}
  S.today.items.push(Object.assign({id:'t'+Date.now().toString(36)+Math.floor(Math.random()*1e3),s:'',e:'',lbl:t.due&&t.due<=o.date?'DUE':'',m:t.m>0?t.m:30,done:false},base));return 'Added to today';}
function tk_doToday(t,force){
  var U=tk_ui(),L=tk_links(t.id);if(L.today)return;
  if(!fresh()){act('Will be in today’s plan',function(){tk_pushToday(t);});return;}
  var m=t.m>0?t.m:30,L=dayLoad(S.today.date),over=L.min+m>L.cap;
  if(over&&!force){U.conf='today';render();tk_focus('tk-today-sch');return;}
  act('Added to today'+(over?' · today at '+hrs(L.min+m)+'h of '+hrs(L.cap)+'h':''),function(){tk_pushToday(t);});
}
/* ---------- urgency (public: Tell Claude and routines call tk_applyUrg inside their own undo envelope) ----------
   Mutates S and returns the toast text. NOW: onto today's plan; when that takes today over its capacity the text says so (never refused).
   THIS WEEK: a local proposal inside the current week (Mon–Sun) in free time, if one fits. LATER: drops the task's pending proposal. */
function tk_applyUrg(t,v){
  if(TK_URG.indexOf(v)<0)v='later';t.urg=v;var lbl=TK_ULBL[v],L=tk_links(t.id);
  if(v==='now'){if(t.status==='done')return lbl;if(L.today)return lbl+' · already on today’s plan';
    if(tk_pushToday(t)!=='Added to today')return lbl+' · will be in today’s plan';
    var L=dayLoad(ops().date);return lbl+' · on today’s plan'+(L.over?' · today at '+loadTxt(ops().date):'');}
  if(v==='week'){if(t.status==='done'||L.today||L.planned||L.prop)return lbl;
    var o=ops(),m0=monday(o.day),end=iso(new Date(m0.getFullYear(),m0.getMonth(),m0.getDate()+6)),p=tk_local(t);
    if(!p.s||!tk_fits(p))return lbl+' · no free slot in the next 7 days';
    tk_fill(t,p);addProposal(p);return lbl+' · suggested '+dayLbl(p.date)+' '+p.s+(p.date>end?' (this week is full)':'');}
  var n=S.proposals.length;S.proposals=S.proposals.filter(function(p){return p.task!==t.id;});
  return lbl+(S.proposals.length<n?' · proposal removed':'');
}
function tk_setUrg(t,v,keep){var msg='';tk_act('',function(){msg=tk_applyUrg(t,v);},keep);if(ui.toast)ui.toast.msg=msg;render();}
/* ---------- projects ---------- */
function tk_merge(P,to){tk_list().forEach(function(t){if(t.proj===P.id)t.proj=to.id;});S.projects=S.projects.filter(function(q){return q!==P;});}
/* the project becomes one task under the project "to"; its tasks become subtasks; a task that had subtasks is flattened (its subtasks become siblings, titled "Parent: Child") */
function tk_convert(P,to){var T=tk_list(),x=tk_new(P.name,to.id,''),first=-1,by={},inP={};x.g=P.g||'';
  T.forEach(function(t){by[t.id]=t;if(t.proj===P.id)inP[t.id]=1;});
  T.forEach(function(t,i){if(!inP[t.id])return;if(first<0)first=i;
    if(t.status!=='done'){if(TK_URG.indexOf(t.urg)<TK_URG.indexOf(x.urg))x.urg=t.urg;if(t.due&&(!x.due||t.due<x.due))x.due=t.due;}
    if(t.parent&&inP[t.parent])t.t=str(by[t.parent].t+': '+t.t,200);t.parent=x.id;t.proj=to.id;});
  if(first<0)T.push(x);else T.splice(first,0,x);
  S.projects=S.projects.filter(function(q){return q!==P;});tk_prune();}
function tk_drop(t){
  var gone={},ds=ops().date;gone[t.id]=1;tk_kids(t.id).forEach(function(k){gone[k.id]=1;});
  tk_list().forEach(function(x){if(gone[x.id]&&(x===t||x.status!=='done'))S.dropped.push({t:x.t,d:x.d,g:tk_goal(x),date:ds});});
  S.tasks=tk_list().filter(function(x){return !gone[x.id];});tk_unlinkSched(gone);
  S.today.items.forEach(function(i){if(i.task&&gone[i.task])delete i.task;});
}

  var t=bid?tk_find(bid):(ui.detail&&ui.detail.k==='task'?tk_find(ui.detail.id):null);
  if(a==='tk-sort'){if(TK_SORTS.some(function(x){return x[0]===v;})){U.sort=v;LS.set('tk.sort',v);U.add=null;U.ask='';U.pm=null;}render();return true;}
  if(a==='tk-filt'){U.filt=v==='done'?'done':'open';LS.set('tk.filt',U.filt);U.add=null;U.ask='';U.pm=null;render();return true;}
  if(a==='tk-augc'){U.addUrg=TK_URG.indexOf(v)>=0?v:'later';render();return true;}

  if(a==='tk-pcx'){U.pc=null;if(U.pf==='del')U.pf='';render();tk_focus('tk-pf-'+(U.pf||'del'));return true;}
  if(a==='tk-pf'){U.pf=U.pf===v?'':v;U.pc=U.pf==='del'?{k:'del'}:null;render();tk_focus(U.pf==='ren'?'tk-ren-in':U.pf==='merge'?'tk-merge-p':U.pf==='conv'?'tk-conv-p':U.pf==='del'?'tk-pcx':'tk-pf-'+v);return true;}
  if(a==='tk-pnew'){U.pnew=true;render();tk_focus('tk-pnew-in');return true;}
  if(a==='tk-pnewx'){U.pnew=false;render();tk_focus('tk-pnew');return true;}
  if(a==='tk-fold'){if(U.fold[v])delete U.fold[v];else U.fold[v]=1;LS.set('tk.fold',U.fold);render();return true;}
  if(a==='tk-add'){U.add=v||'';if(U.fold['p:'+U.add]){delete U.fold['p:'+U.add];LS.set('tk.fold',U.fold);}render();tk_focus('tk-add-in');return true;}
  if(a==='tk-addx'){var ad=U.add;U.add=null;render();tk_focus('tka-'+tk_did('p:'+(ad||'')));return true;}

/* ---- computer: 7-column time grid ---- */

        (one?'<span class="wc-bx one"><b>'+m2h(x.s)+'</b>'+cl+' '+esc(x.t)+'</span>':sm?'<span class="wc-bx" style="-webkit-line-clamp:'+Math.max(1,Math.floor((ht-8)/16))+'">'+(x.clash?'<em>CLASH</em> ':'')+esc(x.t)+'</span>':'<span class="wc-bt">'+tm+cl+'</span><span class="wc-bx" style="-webkit-line-clamp:'+Math.max(1,Math.floor((ht-22)/16))+'">'+esc(x.t)+'</span>')+'</button>';});
    if(D.k===0&&n>=H0*60&&n<=H1*60)h+='<div class="wc-nl" style="top:'+Math.round((n-H0*60)*WC_PX)+'px"><span>'+m2h(n)+'</span></div>';

/* ---- live read through the mcp capability (memory only; the morning job owns S.cal) ---- */
function wc_mcp(){try{var c=window.claude;return c&&typeof c.use==='function'?Promise.resolve(c.use('mcp')).then(null,function(){return null;}):Promise.resolve(null);}catch(e){return Promise.resolve(null);}}
function wc_input(ds){return {startTime:ds+'T00:00:00',endTime:wc_addD(ds,WC_N)+'T04:00:00',orderBy:'startTime',pageSize:250};}
var WC_CACHE={staleTime:5*60000,gcTime:864e5};
function wc_pl(r){var p=r&&typeof r==='object'?r.payload:null;if(typeof p==='string'){try{p=JSON.parse(p);}catch(x){p=null;}}return p&&typeof p==='object'&&Array.isArray(p.events)?p:null;}

  var evs=p.events.slice(),at=r.cache&&+r.cache.storedAt>0?+r.cache.storedAt:Date.now(),tok=typeof p.nextPageToken==='string'?p.nextPageToken:'',n=0;

  if(!tok||!WC.mcp||typeof WC.mcp.callTool!=='function'){done();return;}
  (function more(t){n++;var inp=wc_input(key);inp.pageToken=t;
    Promise.resolve().then(function(){return WC.mcp.callTool(WC_SRV,WC_TOOL,inp,{cache:WC_CACHE});}).then(function(r2){var q=wc_pl(r2);
      if(q){evs=evs.concat(q.events);if(typeof q.nextPageToken==='string'&&q.nextPageToken&&n<4)return more(q.nextPageToken);}done();},done);})(tok);
}
function wc_err(err){
  var c=err&&typeof err.code==='string'?err.code:'upstream_error';WC.code=c;
  if(['needs_reauth','server_not_connected','selection_required','server_not_found','not_in_manifest','blocked_by_policy','approval_required','consent_required'].indexOf(c)>=0){WC.live=null;WC.st='denied';}
  else if(['not_granted','capability_disabled','capability_removed'].indexOf(c)>=0){WC.live=null;WC.st='off';}
  else if(c==='user_changed'){WC.live=null;WC.st='dead';if(WC.unsub){try{WC.unsub();}catch(x){}WC.unsub=null;}}
  else if((c==='bad_request'||c==='transform_error')&&!WC.fell){WC.fell=true;if(WC.unsub){try{WC.unsub();}catch(x){}WC.unsub=null;}wc_call(false);return;}
  else WC.st=WC.live?'live':'err';

}
function wc_call(refresh,cb){
  var m=WC.mcp,key=ops().date,gen=WC.gen;if(!m||typeof m.callTool!=='function'){if(cb)cb(false,{code:'not_granted'});return;}
  function go(again){Promise.resolve().then(function(){return m.callTool(WC_SRV,WC_TOOL,wc_input(key),{cache:refresh?{staleTime:WC_CACHE.staleTime,gcTime:WC_CACHE.gcTime,refresh:true}:WC_CACHE});})
    .then(function(r){wc_got(r,key,gen);if(cb)cb(!!wc_pl(r));},function(err){
      if(err&&err.retryable===true&&!again){setTimeout(function(){go(true);},Math.min(60000,(+err.retryAfterMs||0)+600+Math.floor(Math.random()*1200)));return;}
      if(gen===WC.gen)wc_err(err);if(cb)cb(false,err);});}
  go(false);
}
/* call once after boot and on each minute tick: starts when the calendar view is on, re-keys at the 04:00 rollover */
function wc_live(){
  if(WC.st==='dead')return;var key=ops().date;
  if(WC.started?WC.key===key:!wc_on())return;
  WC.started=true;WC.key=key;WC.fell=false;if(WC.unsub){try{WC.unsub();}catch(x){}WC.unsub=null;}
  var gen=++WC.gen;
  wc_mcp().then(function(m){
    if(gen!==WC.gen)return;if(!m){WC.mcp=null;WC.st='off';WC.code='none';return;}
    WC.mcp=m;if(WC.st==='idle')WC.st='loading';
    if(typeof m.watchTool!=='function'){WC.fell=true;wc_call(false);return;}
    try{WC.unsub=m.watchTool(WC_SRV,WC_TOOL,wc_input(key),function(ev){if(gen!==WC.gen||!ev)return;if(ev.type==='data')wc_got(ev.result,key,gen);else if(ev.type==='error')wc_err(ev.error);},{cache:{staleTime:WC_CACHE.staleTime,gcTime:WC_CACHE.gcTime},refetchInterval:15*60000});}
    catch(x){WC.fell=true;wc_call(false);}
  });
}
function wc_why(cd){var c=cd!=null?cd:WC.code,st=cd!=null?'':WC.st;

/* ---- proposal placement: week strip + day view inside the proposal detail (rDetail -> wc_pPanel) ----

function wc_pBusy(ds,p){var b=[];

  S.planned.concat(S.proposals).forEach(function(q){if(q===p||q.date!==ds)return;var s=mins(q.s);if(s!==null)b.push([s,s+(q.m||itemMin(q))]);});

/* ---------- EVENTS module (prefix ev_) ----------

   the event (kind:'event', a fixed block, not a tickable task) and its prep block as plan items inside one undo envelope,
   then writes both to Google Calendar through the mcp capability (create_event; update_event for a moved calendar event)
   and links each item by calId. An item with a calId, or one that matches a calendar event by date, start and title, hides
   the calendar copy everywhere (ev_owned, applied in wc_src), so nothing shows twice. Undo restores the plan only; it never
   deletes a calendar event. ES5 only. Reads app globals: S, ui, ops, fresh, act, toast, render, queueSave, WC, wc_*, tc_*. */

  var tk=tc_task(String(inp.id==null?'':inp.id));if(!tk)throw new Error('no task with id '+inp.id);if(tk.status!=='open')throw new Error('task '+tk.id+' is already done');
  var o=ops(),up={},ch=[];
  if(inp.t!=null){var t=str(inp.t,120).replace(/\s+/g,' ').trim();if(!t)throw new Error('t cannot be empty');if(t!==tk.t){up.t=t;ch.push('title');}}
  if(inp.d!=null){up.d=str(inp.d,600);ch.push('notes');}
  if(inp.due!=null){var due='';if(String(inp.due).trim()){due=normD(String(inp.due));if(!due)throw new Error('due must be YYYY-MM-DD');if(due<o.date)throw new Error('due date has passed');}if(due!==(tk.due||'')){up.due=due;ch.push(due?'due '+tc_wd(due):'due cleared');}}
  if(inp.m!=null){var m=Math.round(+inp.m);if(!(m>=5&&m<=1440))throw new Error('m must be 5-1440 minutes');if(m!==tk.m){up.m=m;ch.push(m+' min');}}
  if(inp.proj!=null){var pj='';if(String(inp.proj).trim()){var P=tc_projFind(inp.proj);if(!P)throw new Error('unknown project "'+inp.proj+'". Known: '+S.projects.map(function(p){return p.id;}).join(', '));pj=P.id;}
    if(tk.parent)throw new Error('a subtask follows its parent\'s project');if(pj!==(tk.proj||'')){up.proj=pj;ch.push(pj?'→ '+P.name:'no project');}}
  var urg=inp.urg!=null?tc_urgIn(inp.urg):'';if(urg)ch.push(urg.toUpperCase());
  if(!ch.length)throw new Error('nothing to change: pass t, d, urg, due, m or proj');
  Object.keys(up).forEach(function(k){tk[k]=up[k];});
  if(up.proj!=null)S.tasks.forEach(function(c){if(c&&c.parent===tk.id)c.proj=up.proj;});
  var res={id:tk.id,changed:ch};
  if(urg){var ar=tc_applyUrg(tk,urg,null);if(ar.today)res.today='on today\'s plan';if(ar.prop)res.proposed=tc_wd(ar.prop.date)+' '+ar.prop.date+' '+ar.prop.s+'-'+ar.prop.e;if(ar.note)res.note=ar.note;}
  if(tc_st.led)tc_st.led.tasks.push('Updated → '+tc_clip(tk.t,26)+' · '+ch.join(', '));
  markDirty();tc_touch();return res;}

  tc_touch();var r={saved:items.map(function(i){return (i.s||i.lbl||'ANY')+' '+i.t;})};if(cf.length)r.calendar_conflicts=cf;if(dayLoad(o.date).over)r.note='today is now at '+loadTxt(o.date);return r;}

  if(!ch.length)throw new Error('pass weekday and/or weekend minutes');
